name: SkillParity

on:
  push:
    paths:
      - "**.md"
      - "examples/**"
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/skillparity.yml"
  pull_request:
    paths:
      - "**.md"
      - "examples/**"
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/skillparity.yml"
  workflow_dispatch:

jobs:
  mock-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Run SkillParity (mock)
        run: cargo run --locked --quiet -- run --skill examples/summarize-pr --parity examples/summarize-pr/parity.yaml --harness mock --ci
      - name: Upload parity-report.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          path: parity-report.json

  # Optional harnesses. Missing CLIs and missing credentials skip with
  # --skip-ok so the job stays green. continue-on-error keeps a real
  # adapter failure from blocking the mock gate.
  claude-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run SkillParity (claude)
        continue-on-error: true
        run: cargo run --locked --quiet -- run --skill examples/summarize-pr --parity examples/summarize-pr/parity.yaml --harness claude --ci --skip-ok --out reports/claude
      - name: Upload claude parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report-claude
          path: reports/claude/parity-report.json
          if-no-files-found: ignore

  cursor-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run SkillParity (cursor)
        continue-on-error: true
        run: cargo run --locked --quiet -- run --skill examples/summarize-pr --parity examples/summarize-pr/parity.yaml --harness cursor --ci --skip-ok --out reports/cursor
      - name: Upload cursor parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report-cursor
          path: reports/cursor/parity-report.json
          if-no-files-found: ignore

  codex-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run SkillParity (codex)
        continue-on-error: true
        run: cargo run --locked --quiet -- run --skill examples/summarize-pr --parity examples/summarize-pr/parity.yaml --harness codex --ci --skip-ok --out reports/codex
      - name: Upload codex parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report-codex
          path: reports/codex/parity-report.json
          if-no-files-found: ignore

  grok-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run SkillParity (grok)
        continue-on-error: true
        run: cargo run --locked --quiet -- run --skill examples/summarize-pr --parity examples/summarize-pr/parity.yaml --harness grok --ci --skip-ok --out reports/grok
      - name: Upload grok parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report-grok
          path: reports/grok/parity-report.json
          if-no-files-found: ignore
